name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - name: Require the tag to match package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run audit:ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate-primer3:all
      - run: npm run build
      - name: Electron E2E
        run: xvfb-run --auto-servernum npm run test:e2e
      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-e2e-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows x64
    needs: verify
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Build NSIS and portable packages
        run: npm run package:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos:
    name: macOS Intel and Apple Silicon
    needs: verify
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Detect macOS signing certificate
        id: mac-signing
        shell: bash
        env:
          MAC_CERTIFICATE: ${{ secrets.CSC_LINK }}
        run: |
          if [[ -n "$MAC_CERTIFICATE" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build unsigned DMG and ZIP packages
        if: steps.mac-signing.outputs.enabled != 'true'
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Build, sign, and notarize DMG and ZIP packages
        if: steps.mac-signing.outputs.enabled == 'true'
        run: npm run package:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLEID: ${{ secrets.APPLEID }}
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
          APPLETEAMID: ${{ secrets.APPLETEAMID }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate-primer3:linux
      - name: Build AppImage and Debian package
        run: npx electron-builder --linux --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest-linux*.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  finalize:
    name: Assemble release
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: List release assets
        run: ls -lh release-assets
      - name: Keep a combined artifact for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-all-platforms
          path: release-assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" ./release-assets/*
          --verify-tag
          --generate-notes
          --title "OpenVectorEditor $GITHUB_REF_NAME"
